<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AIMS Bin Collection Monitor — Sign in</title>
<style>
  :root{--bg:#0c1118;--card:#141b25;--line:#23303f;--accent:#16a34a;--text:#e6edf3;--muted:#8b9bb0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:
       radial-gradient(1200px 600px at 70% -10%,#16324a 0%,transparent 60%),var(--bg);
       color:var(--text);min-height:100vh;display:grid;place-items:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 32px;
        width:340px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  h1{font-size:17px;margin:0}
  p.sub{color:var(--muted);font-size:12.5px;margin:4px 0 22px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;background:#0e151e;border:1px solid var(--line);border-radius:9px;
        color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:22px;padding:12px;background:var(--accent);border:0;border-radius:9px;
         color:#03150a;font-weight:700;font-size:14px;cursor:pointer}
  .err{color:#f87171;font-size:12.5px;margin-top:14px;display:none}
  .err.show{display:block}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="logo"><span class="dot"></span><h1>AIMS Bin Collection Monitor</h1></div>
    <p class="sub">Fleet bin-collection verification — powered by Kvadrat Systems</p>
    <label>Username</label>
    <input name="username" autocomplete="username" autofocus/>
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password"/>
    <button type="submit">Sign in</button>
    <div class="err" id="err">Invalid credentials. Try again.</div>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('e')) document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
